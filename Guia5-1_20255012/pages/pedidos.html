<!DOCTYPE html>
<html lang="es">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Gestión de pedidos de cafetería
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script defer="" src="../js/pedidos.js">
  </script>
 </head>
 <body class="bg-light">
  <main class="container py-5">
   <div class="card shadow-sm">
    <div class="card-body">
     <h1 class="h3 mb-4">
      Gestión de pedidos de una cafetería
     </h1>
     <form class="row g-3" id="formPedido">
      <div class="col-md-5">
       <label class="form-label" for="producto">
        Producto
       </label>
       <input class="form-control" id="producto" required=""/>
      </div>
      <div class="col-md-3">
       <label class="form-label" for="precio">
        Precio unitario ($)
       </label>
       <input class="form-control" id="precio" min="0.01" required="" step="0.01" type="number"/>
      </div>
      <div class="col-md-2">
       <label class="form-label" for="cantidad">
        Cantidad
       </label>
       <input class="form-control" id="cantidad" min="1" required="" step="1" type="number"/>
      </div>
      <div class="col-md-2 d-flex align-items-end">
       <button class="btn btn-primary w-100" type="submit">
        Agregar pedido
       </button>
      </div>
     </form>
     <p class="mt-3" id="mensaje" role="status">
     </p>
     <div class="row g-2 align-items-end my-3">
      <div class="col-md-4">
       <label class="form-label" for="precioMaximo">
        Precio máximo ($)
       </label>
       <input class="form-control" id="precioMaximo" min="0" step="0.01" type="number"/>
      </div>
      <div class="col-md-auto">
       <button class="btn btn-outline-primary" id="filtrar">
        Filtrar productos
       </button>
      </div>
      <div class="col-md-auto">
       <button class="btn btn-outline-secondary" id="mostrarTodos">
        Mostrar todos
       </button>
      </div>
      <div class="col-md-auto">
       <button class="btn btn-outline-danger" id="limpiar">
        Limpiar pedidos
       </button>
      </div>
     </div>
     <div class="table-responsive">
      <table class="table table-striped table-bordered">
       <thead>
        <tr>
         <th>
          Producto
         </th>
         <th>
          Precio unitario
         </th>
         <th>
          Cantidad
         </th>
         <th>
          Subtotal
         </th>
        </tr>
       </thead>
       <tbody id="tablaPedidos">
       </tbody>
      </table>
     </div>
     <p>
      <strong>
       Total de unidades:
      </strong>
      <span id="totalUnidades">
       0
      </span>
     </p>
     <p>
      <strong>
       Monto total de pedidos:
      </strong>
      $
      <span id="montoTotal">
       0.00
      </span>
     </p>
     <p class="text-muted small">
      Los indicadores muestran todos los pedidos registrados, aunque la tabla esté filtrada.
     </p>
     <a class="btn btn-primary" href="../index.html">
      Regresar
     </a>
    </div>
   </div>
  </main>
 </body>
</html>
